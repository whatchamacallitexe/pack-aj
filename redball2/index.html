<title>Red Ball 2</title>
<style>

<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@latest/ruffle.min.js"></script>

<body>
<div id="game"></div>
<script>

  player.style.height = "100%";
  document.getElementById("game").appendChild(player);
  player.load("https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@083a486880746c027bc1c62d685c7b3052a90bc5/Red%20Ball%202%20-%20Definitive%20Edition.swf");

</script>
