<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Red Ball 3</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
#game { width:100%; height:100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@latest/ruffle.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
(function(){
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.style.width = "100%";
  player.style.height = "100%";
  document.getElementById("game").appendChild(player);
  player.load("https://cdn.jsdelivr.net/gh/mmkgz/flashgames@a776399cb34fbc23911dbd1edca8551de024d611/red%20ball/red-ball-3.swf");
})();
</script>
</body>
</html>
